# Ambiente local de desenvolvimento — banco + Keycloak.
#
# Keycloak: http://localhost:8180 (admin/admin no realm "master").
# O realm "viagem-legal" é importado de keycloak/viagem-legal-realm.json na
# primeira subida; keycloak/viagem-legal-users-0.json cria o usuário de teste
# analista/analista (role ANALISTA) — só pra dev, NÃO importe em produção.
#
#   docker compose up -d
#   docker compose down          (mantém os dados)
#   docker compose down -v       (apaga o volume/dados)

services:
  postgres:
    image: postgres:16-alpine
    container_name: viagemlegal-postgres
    environment:
      POSTGRES_DB: viagemlegal
      POSTGRES_USER: viagemlegal
      POSTGRES_PASSWORD: viagemlegal
    # Host usa 5544 para não colidir com um PostgreSQL instalado nativamente
    # na máquina (que ocupa a 5432). Dentro do container continua 5432.
    ports:
      - "5544:5432"
    volumes:
      - viagemlegal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viagemlegal -d viagemlegal"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: viagemlegal-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Monta em data/ (e não data/h2): a pasta já existe na imagem com dono
      # "keycloak", então o volume herda a permissão. Em data/h2 o Docker cria
      # como root e o Keycloak não consegue gravar o banco H2.
      - viagemlegal-keycloak:/opt/keycloak/data

volumes:
  viagemlegal-pgdata:
  viagemlegal-keycloak:
